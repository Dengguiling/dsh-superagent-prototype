# The front end of the review server.
#
# Gerrit 2.15 in "auth.type = HTTP" mode expects the web server in front of it to
# authenticate the person and to hand the identity over in the Authorization
# header; the error page of Gerrit itself says so.  It has no sign-in form of
# its own: the "Configuration Error" page is all it can show.
#
# The browser needs a challenge it can answer.  A challenge on a background
# request is never shown - Chrome and Firefox answer it only for a page - so the
# proxy asks on the page itself, and passes the header to Gerrit, which
# checks the password of the account and looks the person up as the external id
# "gerrit:<login>".
#
# The proxy asks for the credentials itself before it passes a request on, and
# it keeps two password files (see proxy-start.sh):
#
#   /a/  the REST API, used by the agent and by the scripts: the accounts of
#        the API clients are accepted here.
#   /    the web UI: only the account of the person who reviews the changes is
#        accepted here.  A browser that still holds the credential of an
#        account that Gerrit refuses - an account that was created over the
#        REST API carries no "gerrit:<login>" external id, so Gerrit answers
#        "name already in use" and the browser shows a "Configuration Error"
#        page - therefore gets the challenge again instead of that dead end.

server {
    listen 8080;
    server_name _;

    client_max_body_size 100m;

    # the API of the review server
    location ^~ /a/ {
        auth_basic "Gerrit Code Review";
        auth_basic_user_file /etc/nginx/htpasswd.api;

        proxy_pass http://gerrit:8080/a/;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # the web UI of the review server
    location / {
        auth_basic "Gerrit Code Review";
        auth_basic_user_file /etc/nginx/htpasswd.ui;

        proxy_pass http://gerrit:8080/;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the web UI reads the events of the server as a stream
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
