# The front end of the review server.
#
# Gerrit 2.15 in "auth.type = HTTP" mode expects a web server in front of it to
# authenticate the person and to hand the identity over in the Authorization
# header; it has no sign-in form of its own.  The browser needs a challenge it
# can answer.  A challenge on a background request is never shown - Chrome and
# Firefox answer it only for a page - so the proxy asks on the page itself, and
# passes the header to Gerrit, which checks the password of the account and
# looks the person up as the external id "gerrit:<login>".
#
# The proxy asks for the credentials itself before it passes a request on, and
# it keeps two password files (see proxy-start.sh):
#
#   /a/  the REST API, used by the agent and by the scripts: the accounts of
#        the API clients are accepted here.
#   /    the web UI: only the account of the leader is accepted here.  A
#        browser that still holds the credential of an account that Gerrit
#        refuses - an account that was created over the REST API carries no
#        "gerrit:<login>" external id, so Gerrit answers "name already in use"
#        and the browser shows a "Configuration Error" page - therefore gets
#        the challenge again instead of that dead end.
#
# The sign-in page of the environment (env/login) stores two cookies, so a
# person stays signed in and the session does not expire:
#
#   dsh_auth  the credential of the chosen role, the login and the password.
#              The API of the review server accepts it for every account.
#   dsh_web   the credential the browser is recognised by.  It is the same one
#              for the accounts that carry the external id "gerrit:<login>";
#              for the other accounts it is the e-mail address, which Gerrit
#              accepts in the browser.
#
# A request with the cookie is handed over with the credential it carries, so
# the browser is not asked again; a request without it is challenged as before.

# The credential of the role, for the API of the review server.
map $cookie_dsh_auth $dsh_api_header {
    default $cookie_dsh_auth;
    ""      $http_authorization;
}

# The credential the browser is recognised by, for the web UI.
map $cookie_dsh_web $dsh_web_header {
    default $cookie_dsh_web;
    ""      $http_authorization;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 100m;

    # the API of the review server
    location ^~ /a/ {
        # A signed-in browser carries the credential of its role in a cookie.
        error_page 418 = @with_cookie;
        recursive_error_pages on;
        if ($cookie_dsh_auth) { return 418; }

        auth_basic "Gerrit Code Review";
        auth_basic_user_file /etc/nginx/htpasswd.api;

        proxy_pass http://gerrit:8080/a/;
        proxy_set_header Authorization $dsh_api_header;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # the web UI of the review server
    location / {
        error_page 418 = @with_cookie_web;
        recursive_error_pages on;
        if ($cookie_dsh_web) { return 418; }

        auth_basic "Gerrit Code Review";
        auth_basic_user_file /etc/nginx/htpasswd.ui;

        proxy_pass http://gerrit:8080/;
        proxy_set_header Authorization $dsh_web_header;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the web UI reads the events of the server as a stream
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # the request of a signed-in browser: the credential of its role is handed
    # over instead of asking the browser again
    location @with_cookie {
        proxy_pass http://gerrit:8080;
        proxy_set_header Authorization $cookie_dsh_auth;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # the same, with the credential the browser is recognised by
    location @with_cookie_web {
        proxy_pass http://gerrit:8080;
        proxy_set_header Authorization $cookie_dsh_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
