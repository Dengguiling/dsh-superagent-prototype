[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-sdk"
version = "0.9.0"
description = "Python client of the Demo platform API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Demo Platform Team" }]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["demo_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
