[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdk-cli"
version = "0.9.0"
description = "Command line front end of the Demo platform API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Demo Platform Team" }]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sdk-cli = "sdk_cli.main:main"

[tool.setuptools.packages.find]
include = ["sdk_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
